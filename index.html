                        feature: '營業時間：週一至週五 16:30–23:30; 週六、週日 15:30–23:30。人氣餐點：雞肉串（鳥精肉）、雞翅、豬肉串（豚精肉）及豬五花蘆筍捲（豚アスパラ巻）。', 
                        location: '串鳥 札幌駅北口店', 
                        travelTime: '約 45 分鐘' 
                    },
                    { 
                        id: 604, 
                        title: '札幌西三井花園飯店', 
                        time: '住宿', 
                        ticket: '無', 
                        feature: '休息', 
                        location: '札幌西三井花園飯店', 
                        travelTime: null 
                    },
                ]
            },
            // 3/12
            {
                date: '3/12', day: 'Thu', title: 'Day 7: 賦歸', icon: '✈️', weather: { temp: 'TBD', desc: '載入中...', icon: '❓' },
                details: [
                    { 
                        id: 701, 
                        title: '一幻拉麵 (新千歲機場店)', 
                        time: '9:00-21:00', 
                        ticket: '無', 
                        feature: '菜單特色：濃郁蝦湯頭。提供三種湯頭基底（適量/濃厚/清淡）及細麵或粗麵選擇。位於新千歲機場國內線航廈。', 
                        location: '一幻拉麵', 
                        travelTime: '約 45 分鐘' 
                    },
                    { 
                        id: 702, 
                        title: '新千歲機場報到 (CTS)', 
                        time: '11:30', 
                        ticket: '無', 
                        feature: '國內線航廈有伴手禮店、兒童遊樂區（多啦A夢、Royce\' Chocolate World）。', 
                        location: '新千歲機場', 
                        travelTime: '約 10 分鐘' 
                    },
                    { 
                        id: 703, 
                        title: '班機起飛', 
                        time: '14:30', 
                        ticket: '無', 
                        feature: 'CI0131。', 
                        location: '桃園機場', 
                        travelTime: null 
                    },
                ]
            },
        ];

        const infoData = {
            flights: [
                { type: '去程', flight: 'CI0130', route: '桃園機場 第二航廈 8:35 ⮕ 新千歲機場 13:15' },
                { type: '回程', flight: 'CI0131', route: '新千歲機場 14:40 ⮕ 桃園機場 第二航廈 18:15' }
            ],
            hotels: [
                { dates: '3/6-3/8', name: '札幌大通東急STAY酒店', location: '札幌大通東急STAY酒店' },
                { dates: '3/8-3/9', name: '富良野ホテル FURANO HOTEL', location: '富良野ホテル FURANO HOTEL' },
                { dates: '3/9-3/11', name: '登別溫泉第一瀧本館', location: '登別溫泉第一瀧本館' },
                { dates: '3/11-3/12', name: '札幌西三井花園飯店', location: '札幌西三井花園飯店' }
            ]
        };

        // --- 核心狀態管理與渲染 (Part 2: 邏輯) ---

        let currentState = {
            currentTab: 'trip',
            currentDay: 0,
            trip: tripData,
            // 範例花費
            expenses: [
                { id: 1, price: 5000, currency: 'JPY', method: '現金', category: '交通', note: '機場巴士' },
                { id: 2, price: 1500, currency: 'JPY', method: '刷卡', category: '餐飲', note: 'Soup Curry GARAKU' },
                { id: 3, price: 3600, currency: 'JPY', method: '現金', category: '門票', note: '水族館+天狗山' },
            ],
            expandedDetails: {},
            editingItem: null
        };

        const appContainer = document.getElementById('app');
        const modalContainer = document.getElementById('modal-container');
        const activityForm = document.getElementById('activity-form');
        
        // --- 渲染子函式 ---

        function renderActivityDetails(item, dayIndex, itemIndex) {
            const detailKey = `${dayIndex}-${itemIndex}`;
            const isExpanded = currentState.expandedDetails[detailKey];
            
            const mapLink = getMapLink(item.location);
            
            // 如果 location 存在，將 title 渲染為可導航的連結
            const locationLink = mapLink 
                ? `<a href="${mapLink}" target="_blank" rel="noopener noreferrer" class="location-link">${item.title} 📍</a>`
                : item.title;
            
            // 行程詳細資訊 (完整地將 feature 資訊拆分/呈現)
            const detailsList = [
                { label: '⏰ 時間/營業時間', value: item.time },
                { label: '🎫 門票', value: item.ticket },
                { label: '🌟 完整特色/備註', value: item.feature },
            ].filter(d => d.value && d.value !== '無'); 

            // 將 feature 內容中的分號替換為換行符，使文字更易閱讀
            const formattedFeature = item.feature ? item.feature.replace(/：/g, ': ').replace(/。/g, '。\n').replace(/；/g, '；\n') : '';

            const detailsHtml = detailsList.length > 0 && isExpanded
                ? `<ul class="detail-list">
                    <li>**⏰ 時間/營業時間**: ${item.time}</li>
                    <li>**🎫 門票**: ${item.ticket}</li>
                    <li class="feature-item">**🌟 完整特色/備註**: <pre>${formattedFeature}</pre></li>
                   </ul>`
                : '';
                
            const expandButton = detailsList.length > 0
                ? `<button class="expand-btn" onclick="toggleDetails('${detailKey}')">${isExpanded ? '▲ 收起細節' : '▼ 詳細資訊'}</button>`
                : '';
            
            // 行程排序與編輯按鈕
            const controls = `
                <div class="activity-controls">
                    ${expandButton}
                    <button class="menu-btn edit-btn" onclick="openModalForEdit(${dayIndex}, ${itemIndex})">⚙️</button>
                    ${itemIndex > 0 ? `<button class="menu-btn sort-btn" onclick="moveActivity(${dayIndex}, ${itemIndex}, -1)">⬆️</button>` : ''}
                    ${itemIndex < currentState.trip[dayIndex].details.length - 1 ? `<button class="menu-btn sort-btn" onclick="moveActivity(${dayIndex}, ${itemIndex}, 1)">⬇️</button>` : ''}
                </div>
            `;

            return `
                <li class="activity-item" data-id="${item.id}">
                    <div class="activity-content">
                        <div class="description-wrap">
                            ${locationLink}
                        </div>
                    </div>
                    ${controls}
                    ${detailsHtml}
                </li>
            `;
        }


        function renderDayCard(day, dayIndex) {
            let activitiesHtml = '';
            day.details.forEach((item, itemIndex) => {
                
                activitiesHtml += renderActivityDetails(item, dayIndex, itemIndex);
                
                // 渲染點對點車程時間
                if (item.travelTime && itemIndex < day.details.length - 1) {
                    activitiesHtml += `<p class="travel-time"><span class="icon">🚗</span> ${item.travelTime}</p>`;
                }
            });

            return `
                <div class="day-card">
                    <h2 class="card-title">${day.title}</h2>
                    
                    <div class="weather-box">
                        <span class="weather-icon">${day.weather.icon}</span>
                        <div class="weather-info">
                            <p>天氣: ${day.weather.desc}</p>
                            <p>溫度: ${day.weather.temp}</p>
                        </div>
                    </div>

                    <ul class="activity-list">
                        ${activitiesHtml}
                    </ul>
                    <button class="add-item-btn" onclick="openModalForNew(${dayIndex})">+ 新增行程項目</button>
                </div>
            `;
        }
        
        function renderInfoTab() {
            const flightsHtml = infoData.flights.map(f => `
                <div class="info-item">
                    <span class="info-label">航班編號</span>
                    <p class="info-value">✈️ **${f.flight}** (${f.type})</p>
                    <p class="info-route">${f.route}</p>
                </div>
            `).join('');

            const hotelsHtml = infoData.hotels.map(h => `
                <div class="info-item">
                    <span class="info-label">入住期間：${h.dates}</span>
                    <p class="info-value">🏨 <a href="${getMapLink(h.location)}" target="_blank" rel="noopener noreferrer">${h.name}</a></p>
                </div>
            `).join('');

            return `
                <div class="info-tab">
                    <h2>✈️ 航班資訊</h2>
                    <div class="info-group flight-group">
                        ${flightsHtml}
                    </div>
                    <h2>🏨 住宿資訊</h2>
                    <div class="info-group hotel-group">
                        ${hotelsHtml}
                    </div>
                </div>
            `;
        }
        
        function renderExpenseTab() {
            // 假設所有花費都是日圓，計算總和
            const totalJpy = currentState.expenses.reduce((sum, item) => sum + item.price, 0);
            
            const rowsHtml = currentState.expenses.map(e => `
                <tr>
                    <td>${e.price.toLocaleString('ja-JP')} ${e.currency}</td>
                    <td>${e.method}</td>
                    <td>${e.category}</td>
                    <td>${e.note}</td>
                    <td><button onclick="deleteExpense(${e.id})" class="delete-btn-sm">X</button></td>
                </tr>
            `).join('');

            return `
                <div class="expense-tab">
                    <div class="total-box">
                        <h3>總預估花費： ${totalJpy.toLocaleString('ja-JP')} JPY</h3>
                        <button class="add-expense-btn" onclick="openExpenseModal()">+ 新增花費</button>
                    </div>
                    
                    <table class="expense-table">
                        <thead>
                            <tr>
                                <th>價格</th>
                                <th>支付</th>
                                <th>分類</th>
                                <th>備註</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // 核心渲染函式
        function renderApp() {
            const state = currentState;
            
            let mainContent = '';
            if (state.currentTab === 'info') {
                mainContent = renderInfoTab();
            } else if (state.currentTab === 'expense') {
                mainContent = renderExpenseTab();
            } else {
                // Trip Tab
                const currentDayData = state.trip[state.currentDay];
                
                const navButtonsHtml = state.trip.map((day, index) => {
                    const isActive = state.currentDay === index ? 'active' : '';
                    const dayString = day.day; 
                    const dateString = day.date.split('/')[1]; 
                    
                    return `<button class="nav-button ${isActive}" onclick="updateState({ currentDay: ${index} })">
                                <span class="nav-day">${dayString}</span>
                                <span class="nav-date">${dateString}</span>
                            </button>`;
                }).join('');
                
                const dayDetailHtml = renderDayCard(currentDayData, state.currentDay);

                mainContent = `
                    <nav class="day-nav">
                        ${navButtonsHtml}
                    </nav>
                    <main class="trip-detail-card">
                        ${dayDetailHtml}
                    </main>
                `;
            }
            
            appContainer.innerHTML = `
                <nav class="main-tab-nav">
                    <button class="main-tab-btn ${state.currentTab === 'trip' ? 'active' : ''}" onclick="updateState({ currentTab: 'trip', currentDay: 0 })">🗺️ 行程</button>
                    <button class="main-tab-btn ${state.currentTab === 'info' ? 'active' : ''}" onclick="updateState({ currentTab: 'info' })">ℹ️ 資訊</button>
                    <button class="main-tab-btn ${state.currentTab === 'expense' ? 'active' : ''}" onclick="updateState({ currentTab: 'expense' })">💰 花費</button>
                </nav>
                
                <div class="main-content-area">
                    ${mainContent}
                </div>
            `;
        }

        // --- 狀態更新與互動邏輯 ---

        function updateState(newState) {
            currentState = { ...currentState, ...newState };
            renderApp();
        }
        
        function toggleDetails(key) {
            const expandedDetails = { ...currentState.expandedDetails };
            expandedDetails[key] = !expandedDetails[key];
            updateState({ expandedDetails });
        }
        
        function moveActivity(dayIndex, itemIndex, direction) {
            const dayDetails = currentState.trip[dayIndex].details;
            const newIndex = itemIndex + direction;

            if (newIndex >= 0 && newIndex < dayDetails.length) {
                [dayDetails[itemIndex], dayDetails[newIndex]] = [dayDetails[newIndex], dayDetails[itemIndex]];
                updateState({});
            }
        }

        function closeModal() {
            modalContainer.style.display = 'none';
            currentState.editingItem = null;
        }

        function openModal(dayIndex, itemIndex, isNew) {
            modalContainer.style.display = 'flex';
            
            let activity = isNew ? 
                { id: Date.now(), title: '', time: '', ticket: '', feature: '', location: '', travelTime: '' } :
                currentState.trip[dayIndex].details[itemIndex];

            currentState.editingItem = { dayIndex, itemIndex, activity, isNew };

            // 生成表單內容 (確保欄位對應)
            const formFields = [
                { id: 'title', label: '景點/餐廳名稱 (必填)', type: 'text', value: activity.title, required: true },
                { id: 'time', label: '時間/營業時間', type: 'text', value: activity.time },
                { id: 'ticket', label: '門票資訊 (e.g. 成人 ¥1800)', type: 'text', value: activity.ticket },
                { id: 'feature', label: '特色/備註 (完整且詳細)', type: 'textarea', value: activity.feature },
                { id: 'location', label: '地點 (地圖導航用)', type: 'text', value: activity.location, required: true },
                { id: 'travelTime', label: '車程時間 (下一個點的車程)', type: 'text', value: activity.travelTime },
            ];

            const formHtml = formFields.map(field => `
                <label for="${field.id}">${field.label}${field.required ? ' *' : ''}</label>
                ${field.type === 'textarea' ? 
                    `<textarea id="${field.id}" name="${field.id}" ${field.required ? 'required' : ''}>${field.value || ''}</textarea>` :
                    `<input type="${field.type}" id="${field.id}" name="${field.id}" value="${field.value || ''}" ${field.required ? 'required' : ''}>`
                }
            `).join('');

            const deleteButton = !isNew ? `<button type="button" class="delete-btn" onclick="deleteActivity(${dayIndex}, ${itemIndex})">刪除此行程</button>` : '';

            activityForm.innerHTML = `
                ${formHtml}
                <div class="form-actions">
                    ${deleteButton}
                    <button type="submit" class="save-btn">儲存修改</button>
                </div>
            `;
        }

        function openModalForEdit(dayIndex, itemIndex) {
            openModal(dayIndex, itemIndex, false);
        }

        function openModalForNew(dayIndex) {
            openModal(dayIndex, -1, true);
        }

        activityForm.onsubmit = function(e) {
            e.preventDefault();
            
            const item = currentState.editingItem;
            const formData = new FormData(activityForm);
            
            const newActivity = {
                id: item.activity.id,
                title: formData.get('title'),
                time: formData.get('time'),
                ticket: formData.get('ticket'),
                feature: formData.get('feature'),
                location: formData.get('location'),
                travelTime: formData.get('travelTime'),
            };

            const dayDetails = currentState.trip[item.dayIndex].details;

            if (item.isNew) {
                dayDetails.push(newActivity);
            } else {
                dayDetails[item.itemIndex] = newActivity;
            }

            closeModal();
            updateState({});
        };
        
        function deleteActivity(dayIndex, itemIndex) {
            if (confirm('確定要刪除這個行程嗎？')) {
                currentState.trip[dayIndex].details.splice(itemIndex, 1);
                closeModal();
                updateState({});
            }
        }
        
        // ------------------- 簡易花費管理功能 -------------------
        
        function openExpenseModal() {
            // 這裡可以彈出一個新的模態視窗來新增花費
            const newExpenseId = Date.now();
            const newExpense = prompt("請輸入新增的花費資訊 (格式: 價格,幣別,方式,分類,備註)", "2500,JPY,現金,餐飲,早餐");
            
            if (newExpense) {
                const parts = newExpense.split(',');
                if (parts.length === 5) {
                    const [price, currency, method, category, note] = parts;
                    currentState.expenses.push({
                        id: newExpenseId,
                        price: parseInt(price, 10),
                        currency: currency.trim(),
                        method: method.trim(),
                        category: category.trim(),
                        note: note.trim()
                    });
                    updateState({ currentTab: 'expense' });
                } else {
                    alert("格式錯誤，請確保輸入五個欄位並以逗號分隔。");
                }
            }
        }

        function deleteExpense(expenseId) {
            if (confirm('確定要刪除這筆花費記錄嗎？')) {
                currentState.expenses = currentState.expenses.filter(e => e.id !== expenseId);
                updateState({ currentTab: 'expense' });
            }
        }
        
        // ------------------------------------
        // 將核心功能暴露給 HTML 事件
        window.toggleDetails = toggleDetails;
        window.updateState = updateState;
        window.moveActivity = moveActivity;
        window.openModalForEdit = openModalForEdit;
        window.openModalForNew = openModalForNew;
        window.closeModal = closeModal;
        window.deleteActivity = deleteActivity;
        window.openExpenseModal = openExpenseModal;
        window.deleteExpense = deleteExpense;


        // 模擬 API 抓取函式 (使用模擬數據)
        async function fetchWeather(city, dateString) {
            const mockWeather = {
                '3/6': { temp: '-2°C / 2°C', desc: '晴時多雲', icon: '☁️' },
                '3/7': { temp: '-5°C / 0°C', desc: '大雪', icon: '🌨️' },
                '3/8': { temp: '-8°C / -3°C', desc: '晴朗寒冷', icon: '☀️' },
                '3/9': { temp: '-1°C / 4°C', desc: '雨夾雪', icon: '🌧️' },
                '3/10': { temp: '-3°C / 2°C', desc: '多雲', icon: '🌥️' },
                '3/11': { temp: '-4°C / 1°C', desc: '零星降雪', icon: '❄️' },
                '3/12': { temp: '-1°C / 3°C', desc: '多雲', icon: '☁️' },
            };
            await new Promise(resolve => setTimeout(resolve, 500)); 
            return mockWeather[dateString] || { temp: 'N/A', desc: '無法取得預報', icon: '❌' };
        }

        // 載入所有天氣數據
        async function loadAllWeather() {
            const primaryCity = 'Sapporo, JP';
            const newStateTrip = [...currentState.trip];

            for (let i = 0; i < newStateTrip.length; i++) {
                const day = newStateTrip[i];
                const weather = await fetchWeather(primaryCity, day.date);

                newStateTrip[i].weather = weather;
                
                currentState = { ...currentState, trip: newStateTrip };
                renderApp();
            }
        }

        // 應用程式啟動
        window.onload = () => {
            renderApp(); // 第一次渲染初始狀態
            loadAllWeather(); // 異步載入天氣
        };

    </script>
</body>
