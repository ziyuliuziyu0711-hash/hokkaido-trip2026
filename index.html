                return cleanName;
            }
            // 處理簡單描述
            return desc.trim().split(' ')[0].replace(/^[❶-❼✈️🏨🍽️📷🛍️🚗🐧🍜🚠🍫❄️🐻🔥🏪]/, '').trim();

        // 輔助函式：生成 Google Maps 連結 (已修正：修復語法錯誤)
        function getMapLink(locationName) {
            if (!locationName) return null;
            // 修正為標準 Google Maps 搜尋 URL，確保 JavaScript 語法正確
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(locationName + ', 北海道')}`;
        }
        
        // --- 渲染子函式 ---

        // 渲染單一活動細節
        function renderActivityDetails(item, dayIndex, itemIndex) {
            const detailKey = `${dayIndex}-${itemIndex}`;
            const isExpanded = currentState.expandedDetails[detailKey];
            
            // 提取地點名稱並確保它不是空字符串
            let mainLocation = extractLocationName(item.desc);
            // 如果提取失敗，使用 item.location 作為備用
            if (!mainLocation || mainLocation.trim() === '') {
                mainLocation = item.location;
            }
            
            const mapLink = getMapLink(mainLocation);
            
            // 點擊地點名稱時導航
            const locationLink = mapLink 
                ? `<a href="${mapLink}" target="_blank" rel="noopener noreferrer" class="location-link">${mainLocation}</a>`
                : mainLocation;
            
            // 替換描述中的第一個地點名稱為連結
            let descriptiveText = item.desc;
            if (mainLocation) {
                // 替換描述中的第一個地點名稱為超連結，同時保留前面的編號/符號
                const regex = new RegExp(`(${item.desc.split(mainLocation)[0].match(/^[❶-❼✈️🏨🍽️📷🛍️🚗🐧🍜🚠🍫❄️🐻🔥🏪]*\s*/)?.[0] || ''})?${mainLocation}`);
                descriptiveText = item.desc.replace(regex, `$1${locationLink}`);
            }


            const travelTimeHtml = item.travelTime 
                ? `<p class="travel-time"><span class="icon">🚗 </span>車程：${item.travelTime}</p>`
                : '';
            
            const detailsHtml = item.details && isExpanded
                ? `<ul class="detail-list">${item.details.map(d => `<li>${d}</li>`).join('')}</ul>`
                : '';
                
            const expandButton = item.details
                ? `<button class="expand-btn" onclick="toggleDetails('${detailKey}')">${isExpanded ? '▲ 收起' : '▼ 特色'}</button>`
                : '';
            
            // 替換方案 (Alt Option) 渲染
            const altOptionHtml = item.alt
                ? `
                <div class="alt-option">
                    或 <a href="${getMapLink(item.alt.location)}" target="_blank" rel="noopener noreferrer">${item.alt.desc}</a>
                    ${item.alt.details ? `<ul class="alt-detail-list">${item.alt.details.map(d => `<li>${d}</li>`).join('')}</ul>` : ''}
                </div>
                `
                : '';
            
            return `
                <li class="activity-item">
                    <div class="activity-content">
                        <span class="time">${item.time ? `${item.time} | ` : ''}</span>
                        <div class="description-wrap">
                            ${descriptiveText}
                            ${travelTimeHtml}
                            ${altOptionHtml}
                        </div>
                    </div>
                    <div class="activity-controls">
                        ${expandButton}
                        <button class="menu-btn" onclick="alert('TODO: 實現編輯/刪除功能')">⚙️</button>
                    </div>
                    ${detailsHtml}
                </li>
            `;
        }

        // 渲染單一日的卡片
        function renderDayCard(day, dayIndex) {
            const activitiesHtml = day.details.map((item, itemIndex) => renderActivityDetails(item, dayIndex, itemIndex)).join('');

            return `

                    <div class="weather-box">

                    <button class="add-item-btn" onclick="alert('TODO: 實現新增行程項目功能')">+ 新增行程項目</button>

            return `

                    </div>
                </div>
            `;
        }
        
        // 渲染花費分頁
        function renderExpenseTab() {
            const totalJpy = currentState.expenses.reduce((sum, item) => sum + item.price, 0);
            
            const rowsHtml = currentState.expenses.map(e => `
                <tr>
                    <td>${e.price.toLocaleString('ja-JP')} ${e.currency}</td>
                    <td>${e.method}</td>
                    <td>${e.category}</td>
                    <td>${e.note}</td>
                    <td><button onclick="alert('TODO: 實現刪除花費 ${e.id}')" class="delete-btn">X</button></td>
                </tr>
            `).join('');

            return `
                <div class="expense-tab">
                    <div class="total-box">
                        <h3>總預估花費： ${totalJpy.toLocaleString('ja-JP')} JPY</h3>

            `;
        }

        // 核心渲染函式
        function renderApp() {
            const state = currentState;
            
            let mainContent = '';
            if (state.currentTab === 'info') {
                mainContent = renderInfoTab();
            } else if (state.currentTab === 'expense') {
                mainContent = renderExpenseTab();
            } else {
                // Trip Tab
                const currentDayData = state.trip[state.currentDay];
                
                const navButtonsHtml = state.trip.map((day, index) => {
                    const isActive = state.currentDay === index ? 'active' : '';
                    const dayString = day.day; // Fri, Sat, Sun...
                    const dateString = day.date.split('/')[1]; // 6, 7, 8...
                    
                    // 點擊時，切換當前日
                    return `<button class="nav-button ${isActive}" onclick="updateState({ currentDay: ${index} })">
                                <span class="nav-day">${dayString}</span>
                                <span class="nav-date">${dateString}</span>
                            </button>`;
                }).join('');
                
                const dayDetailHtml = renderDayCard(currentDayData, state.currentDay);

                mainContent = `
                    <nav class="day-nav">
                        ${navButtonsHtml}
                    </nav>
                    <main class="trip-detail-card">
                        ${dayDetailHtml}
                    </main>
                `;
            }
            
            // 將內容渲染到 #app 容器中
            appContainer.innerHTML = `
                <nav class="main-tab-nav">
                    <button class="main-tab-btn ${state.currentTab === 'trip' ? 'active' : ''}" onclick="updateState({ currentTab: 'trip', currentDay: 0 })">🗺️ 行程</button>
                    <button class="main-tab-btn ${state.currentTab === 'info' ? 'active' : ''}" onclick="updateState({ currentTab: 'info' })">ℹ️ 資訊</button>
                    <button class="main-tab-btn ${state.currentTab === 'expense' ? 'active' : ''}" onclick="updateState({ currentTab: 'expense' })">💰 花費</button>
                </nav>
                
                <div class="main-content-area">
                    ${mainContent}
                </div>
            `;
        }

        // --- 狀態更新與天氣載入 ---

        function updateState(newState) {
            currentState = { ...currentState, ...newState };
            renderApp();
        }
        
        // 切換細節展開/收起
        function toggleDetails(key) {
            const expandedDetails = { ...currentState.expandedDetails };
            expandedDetails[key] = !expandedDetails[key];
            updateState({ expandedDetails });
        }
        
        // 將 toggleDetails 暴露給 HTML onClick 事件
        window.toggleDetails = toggleDetails;
        window.updateState = updateState;

        // 模擬 API 抓取函式 (使用模擬數據)
        async function fetchWeather(city, dateString) {
            const mockWeather = {
                '3/6': { temp: '-2°C / 2°C', desc: '晴時多雲', icon: '☁️' },
                '3/7': { temp: '-5°C / 0°C', desc: '大雪', icon: '🌨️' },
                '3/8': { temp: '-8°C / -3°C', desc: '晴朗寒冷', icon: '☀️' },
                '3/9': { temp: '-1°C / 4°C', desc: '雨夾雪', icon: '🌧️' },
                '3/10': { temp: '-3°C / 2°C', desc: '多雲', icon: '🌥️' },
                '3/11': { temp: '-4°C / 1°C', desc: '零星降雪', icon: '❄️' },
                '3/12': { temp: '-1°C / 3°C', desc: '多雲', icon: '☁️' },
            };
            await new Promise(resolve => setTimeout(resolve, 500)); 
            return mockWeather[dateString] || { temp: 'N/A', desc: '無法取得預報', icon: '❌' };
        }

        // 載入所有天氣數據
        async function loadAllWeather() {
            const primaryCity = 'Sapporo, JP';
            const newStateTrip = [...currentState.trip];

            for (let i = 0; i < newStateTrip.length; i++) {
                const day = newStateTrip[i];
                const weather = await fetchWeather(primaryCity, day.date);

                newStateTrip[i].weather = weather;
                
                // 更新狀態並重新渲染
                currentState = { ...currentState, trip: newStateTrip };
                renderApp();
            }
        }

        // 應用程式啟動
        window.onload = () => {
            renderApp(); // 第一次渲染初始狀態
            loadAllWeather(); // 異步載入天氣
        };

    </script>
</body>
</html>
