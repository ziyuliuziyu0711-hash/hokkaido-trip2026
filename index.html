            },
            {
                date: '3/11', day: '三', title: 'Day 6: 札幌回歸 & 購物', icon: '🛍️',

                details: [
                    { time: '上午', desc: '❄️ 羊之丘展望台', location: '羊之丘展望台', travelTime: '登別出發約 1 小時 30 分鐘' },
                    { time: '中午', desc: '🛍️ 北廣島Outlet', location: '三井アウトレットパーク 札幌北広島' },
                    { time: '晚餐', desc: '🍽️ 串鳥', location: '串鳥 時計台店' },
                    { time: '晚上', desc: '🛍️ 最後採購', location: '札幌狸小路商店街' },
                    { time: '住宿', desc: '🏨 札幌西三井花園飯店', location: '札幌西三井花園飯店' },
                ]
            },
            {
                date: '3/12', day: '四', title: 'Day 7: 賦歸', icon: '✈️',
                weather: { temp: 'TBD', desc: '載入中...', icon: '❓' },
                details: [
                    { time: '上午', desc: '🍜 新千歲機場國內線：一幻拉麵', location: '新千歲機場' },
                    { time: '11:30', desc: '機場報到 (新千歲機場 CTS)' },
                    { time: '14:30', desc: '✈️ 班機起飛' },
                ]
            },
        ];

        // 核心狀態管理 (取代 Vibe.updateState)
        let currentState = {
            currentDay: 0,
            trip: tripData
        };

        // DOM 渲染目標
        const appContainer = document.getElementById('app');
        
        // 輔助函式：生成 Google Maps 連結 (已修正)
        function getMapLink(locationName) {
            if (!locationName) return null;
            // 使用正確的 Google Maps 搜尋 URL 格式
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(locationName + ', 北海道')}`;
        }
        
        // --- 核心渲染邏輯 ---

        // 輔助函式：渲染單一日的卡片 (使用標準 HTML 字串)
        function renderDayCard(day) {
            const activitiesHtml = day.details.map(item => {
                const mapLink = getMapLink(item.location);
                const travelTimeHtml = item.travelTime 
                    ? `<p class="travel-time"><span class="icon">🚗 </span>車程：${item.travelTime}</p>`
                    : '';
                const mapButtonHtml = mapLink 
                    ? `<a class="map-link-btn" href="${mapLink}" target="_blank" rel="noopener noreferrer">🗺️ 地圖</a>`
                    : '';

                return `
                    <li class="activity-item">
                        <div class="activity-content">
                            <span class="time">${item.time ? `${item.time} | ` : ''}</span>
                            ${item.desc}
                            ${travelTimeHtml}
                        </div>
                        ${mapButtonHtml}
                    </li>
                `;
            }).join('');

            return `
                <div class="day-card">
                    <h2 class="card-title">${day.icon} ${day.title}</h2>
                    <div class="weather-box">
                        <span class="weather-icon">${day.weather.icon}</span>
                        <div class="weather-info">
                            <p>天氣: ${day.weather.desc}</p>
                            <p>溫度: ${day.weather.temp}</p>
                        </div>
                    </div>
                    <ul class="activity-list">
                        ${activitiesHtml}
                    </ul>
                </div>
            `;
        }

        // 核心渲染函式 (取代 appView)
        function renderApp() {
            const state = currentState;
            const currentDayData = state.trip[state.currentDay];
            
            const navButtonsHtml = state.trip.map((day, index) => {
                const isActive = state.currentDay === index ? 'active' : '';
                // 點擊時，呼叫 updateState 並重新渲染
                return `<button class="nav-button ${isActive}" onclick="updateState({ currentDay: ${index} })">
                            ${day.date} (${day.day})
                        </button>`;
            }).join('');
            
            const dayDetailHtml = renderDayCard(currentDayData);

            appContainer.innerHTML = `
                <div class="app-container">
                    <header class="app-header">
                        <h1>❄️ 北海道雪國七日旅 2025</h1>
                    </header>
                    <nav class="day-nav">
                        ${navButtonsHtml}
                    </nav>
                    <main class="trip-detail-card">
                        ${dayDetailHtml}
                    </main>
                </div>
            `;
        }

        // 取代 Vibe.updateState
        function updateState(newState) {
            currentState = { ...currentState, ...newState };
            renderApp();
        }

        // ------------------------------------------------------------------
        // C. 天氣預報整合 (模擬數據)
        // ------------------------------------------------------------------

        // 假設 API 抓取函式 (使用模擬數據)
        async function fetchWeather(city, dateString) {
            const mockWeather = {
                '3/6': { temp: '-2°C / 2°C', desc: '晴時多雲，偶有降雪', icon: '☁️' },
                '3/7': { temp: '-5°C / 0°C', desc: '大雪', icon: '🌨️' },
                '3/8': { temp: '-8°C / -3°C', desc: '晴朗寒冷', icon: '☀️' },
                '3/9': { temp: '-1°C / 4°C', desc: '雨夾雪', icon: '🌧️' },
                '3/10': { temp: '-3°C / 2°C', desc: '多雲', icon: '🌥️' },
                '3/11': { temp: '-4°C / 1°C', desc: '零星降雪', icon: '❄️' },
                '3/12': { temp: '-1°C / 3°C', desc: '多雲', icon: '☁️' },
            };
            await new Promise(resolve => setTimeout(resolve, 500)); 
            return mockWeather[dateString] || { temp: 'N/A', desc: '無法取得預報', icon: '❌' };
        }

        // 載入所有天氣數據
        async function loadAllWeather() {
            const primaryCity = 'Sapporo, JP';
            const newStateTrip = [...currentState.trip];

            for (let i = 0; i < newStateTrip.length; i++) {
                const day = newStateTrip[i];
                const weather = await fetchWeather(primaryCity, day.date);

                newStateTrip[i].weather = weather;
                
                // 更新狀態並重新渲染
                updateState({ trip: newStateTrip });
            }
        }

        // 應用程式啟動
        window.onload = () => {
            renderApp(); // 第一次渲染初始狀態
            loadAllWeather(); // 異步載入天氣
        };

    </script>
