// 輔助函式：生成 Google Maps 連結
function getMapLink(locationName) {
    if (!locationName) return null;
    // 使用 q 參數進行地點名稱搜尋
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(locationName + ', 北海道')}`;
}


// 輔助函式：渲染單一日的卡片 (更新版)
function renderDayCard(day) {
    return Vibe.createElement('div', { className: 'day-card' },
        // ... (省略標題和天氣部分，保持不變) ...

        // 行程列表
        Vibe.createElement('ul', { className: 'activity-list' },
            day.details.map(item => {
                const mapLink = getMapLink(item.location);
                return Vibe.createElement('li', { className: 'activity-item' },
                    Vibe.createElement('div', { className: 'activity-content' },
                        Vibe.createElement('span', { className: 'time' }, item.time ? `${item.time} | ` : ''),
                        item.desc,
                        // 新增：車程時間 (如果存在)
                        item.travelTime && Vibe.createElement('p', { className: 'travel-time' },
                            Vibe.createElement('span', { className: 'icon' }, '🚗 '),
                            `車程：${item.travelTime}`
                        )
                    ),
                    // 新增：地圖連結按鈕 (如果 location 存在)
                    mapLink && Vibe.createElement('a', {
                        className: 'map-link-btn',
                        href: mapLink,
                        target: '_blank', // 在新視窗開啟
                        rel: 'noopener noreferrer'
                    }, '🗺️ 地圖')
                );
            })
        )
    );
}
