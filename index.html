            const destination = locationArray.pop();
            const waypoints = locationArray.slice(1, locationArray.length).join('|');

            return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}${waypoints ? `&waypoints=${encodeURIComponent(waypoints)}` : ''}&travelmode=driving`;
        }
        
        function getWeather(date) {
             const day = currentState.tripData.find(d => d.date === date);
             return day ? day.weather : { temp: 'TBD', desc: '無法取得', icon: '❓' };
        }

        // ******************************************************
        // *** 渲染函數 ***
        // ******************************************************
        
        function renderApp() {
            const app = document.getElementById('app');
            let html = '';

            html += renderMainTabNav();
            
            switch (currentState.currentTab) {
                case 'trip':
                    html += renderTripTab();
                    break;
                case 'info':
                    html += renderInfoStationTab();
                    break;
                case 'shopping':
                    html += renderShoppingListTab();
                    break;
                case 'expense':
                    html += renderExpenseTab(); // 使用新設計的 Expense Tab
                    break;
            }

            app.innerHTML = html;
        }

        function renderMainTabNav() {
            const tabs = [
                { id: 'trip', name: '行程' }, 
                { id: 'info', name: '資訊站' }, 
                { id: 'shopping', name: '購物清單' }, 
                { id: 'expense', name: '花費' }
            ];
            
            let navHtml = '<div class="main-tab-nav">';
            tabs.forEach(tab => {
                const activeClass = currentState.currentTab === tab.id ? 'active' : '';
                navHtml += `<button class="main-tab-btn ${activeClass}" onclick="updateState({ currentTab: '${tab.id}' })">${tab.name}</button>`;
            });
            navHtml += '</div>';
            return navHtml;
        }

        function renderDayNav(data) {
            let navHtml = '<div class="day-nav">';
            data.forEach(day => {
                const activeClass = currentState.currentDay === day.date ? 'active' : '';
                navHtml += `
                    <button class="nav-button ${activeClass}" onclick="updateState({ currentDay: '${day.date}', currentFilter: 'all' })">
                        <span class="nav-day-abbr">${day.dayAbbr}</span>
                        <span class="nav-date">${day.date.split('/')[1]}</span>
                    </button>
                `;
            });
            navHtml += '</div>';
            return navHtml;
        }

        function renderWeatherBox(date) {
            const weather = getWeather(date);
            return `
                <div class="weather-info-box">
                    <span class="weather-icon">${weather.icon}</span>
                    <div class="weather-info">
                        <p class="weather-desc">${weather.desc}</p>
                        <p class="weather-temp">${weather.temp}</p>
                    </div>
                    <p style="font-size:0.75em; color: var(--light-text-color); margin: 0;">*天氣資訊為靜態模擬</p>
                </div>
            `;
        }

        function renderTripTab() {
            const currentDayData = currentState.tripData.find(day => day.date === currentState.currentDay);
            if (!currentDayData) return '';
            
            let html = '';
            
            html += renderDayNav(currentState.tripData);
            
            html += `
                <div class="day-detail-area">
                    <div class="day-card">
                        <h2 class="card-title">${currentDayData.icon} ${currentDayData.title}</h2>
                        ${renderWeatherBox(currentDayData.date)}
                        <p class="toll-estimate" style="color:var(--primary-color); font-weight:500;">🛣️ 當日過路費預估: ${currentDayData.dailyTollEstimate}</p>
                        
                        <div class="filter-section">
                            <label for="activity-filter" style="font-weight:500;">篩選活動類別:</label>
                            <select id="activity-filter" onchange="updateState({ currentFilter: this.value })">
                                <option value="all" ${currentState.currentFilter === 'all' ? 'selected' : ''}>所有活動</option>
                                ${Object.keys(activityCategories).map(key => `
                                    <option value="${key}" ${currentState.currentFilter === key ? 'selected' : ''}>${activityCategories[key]}</option>
                                `).join('')}
                            </select>
                        </div>
                        
                        ${getMapRouteLink(currentDayData) ? `<a href="${getMapRouteLink(currentDayData)}" target="_blank" class="day-map-btn">📍 顯示當日開車導航路線</a>` : ''}

                        ${renderDayDetails(currentDayData)}
                        
                        <button class="add-item-btn" onclick="openModalForNew('${currentDayData.date}')">➕ 新增行程項目</button>
                    </div>
                </div>
            `;
            return html;
        }

        function renderDayDetails(dayData) {
            const filteredDetails = dayData.details.filter(activity => 
                currentState.currentFilter === 'all' || activity.category === currentState.currentFilter
            );

            let html = '<ul class="activity-list">';

            filteredDetails.forEach((activity) => {
                const isFlight = activity.category === 'flight';
                let activityContentHtml;

                if (isFlight) {
                    const match = activity.title.match(/(.*) \((.*)\) → (.*) \((.*)\)/);
                    const [full, fromCity, fromCode, toCity, toCode] = match || [];
                    const flightNumber = activity.ticket;
                    const flightTime = activity.feature.match(/飛行時間\s*(\d+小時\d+分)/)?.[1] || activity.time;

                    activityContentHtml = `
                        <div class="flight-box">
                            <div class="flight-number">${flightNumber.replace(/CI/g, '')}</div>
                            <div class="flight-info">
                                <div class="route-text">
                                    <span class="airport-code">${fromCode}</span>
                                    <span class="route-line"><span class="icon">✈️</span></span>
                                    <span class="airport-code">${toCode}</span>
                                </div>
                                <div class="flight-time">${flightTime}</div>
                            </div>
                        </div>
                        <div class="activity-controls">
                            <button class="menu-btn" onclick="openModalForEdit(${activity.id}, '${dayData.date}')">⚙️</button>
                        </div>
                    `;
                } else {
                    const categoryLabel = activityCategories[activity.category] || '其他';
                    const locationLink = activity.location ? `
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(activity.location + ', 北海道')}" target="_blank" class="location-link">
                            ${activity.title} 
                        </a>
                    ` : activity.title;

                    activityContentHtml = `
                        <div class="description-wrap" onclick="toggleDetails(${activity.id})">
                            <span class="activity-category category-${activity.category}">${categoryLabel}</span>
                            <span class="time" style="font-weight:700;">${activity.time}</span>
                            ${locationLink}
                        </div>
                        <div class="activity-controls">
                            <div class="move-btn-group">
                                <button onclick="moveActivity('${dayData.date}', ${activity.id}, -1)">▲</button>
                                <button onclick="moveActivity('${dayData.date}', ${activity.id}, 1)">▼</button>
                            </div>
                            <button class="menu-btn" onclick="openModalForEdit(${activity.id}, '${dayData.date}')">⚙️</button>
                        </div>
                    `;
                }

                html += `
                    <li class="activity-item" id="activity-${activity.id}" style="border-left-color: ${isFlight ? 'var(--flight-color)' : 'var(--secondary-color)'};">
                        ${activityContentHtml}
                        ${activity.travelTime ? `<div class="travel-time">🚗 ${activity.travelTime}</div>` : ''}
                        
                        ${activity.showDetails ? `
                            <ul class="detail-list">
                                <li><span class="detail-label" style="font-weight:700; color:var(--light-text-color);">地點:</span> ${activity.location || 'N/A'}</li>
                                <li><span class="detail-label" style="font-weight:700; color:var(--light-text-color);">門票/費用:</span> ${activity.ticket}</li>
                                <li class="feature-item"><span class="detail-label" style="font-weight:700; color:var(--light-text-color);">備註:</span> <pre>${activity.feature}</pre></li>
                            </ul>
                        ` : ''}
                    </li>
                `;
            });

            html += '</ul>';
            return html;
        }


        // 渲染資訊站頁面 (已修正)
        function renderInfoStationTab() {
            let html = `
                <div class="info-tab">
                    <h2 class="info-category-title">總覽與實用資訊</h2>
            `;
            
            currentState.infoStation.forEach(item => {
                html += `
                    <div class="info-item">
                        <h3 class="info-label">${item.title}</h3>
                        <p class="info-value">${item.content.replace(/\n/g, '<br>')}</p>
                        ${item.link ? `
                            <a href="${item.link}" target="_blank" class="map-link-btn">
                                ${item.category === 'parenting' ? '前往 Mamapapamaps App' : '查看相關連結'}
                            </a>
                        ` : ''}
                    </div>
                `;
            });
            
            html += `
                </div>
            `;
            return html;
        }
        
        // 渲染購物清單頁面 (使用新 CSS)
        function renderShoppingListTab() {
            let html = `
                <div class="shopping-tab">
                    <button class="add-shopping-btn" onclick="openShoppingModalForNew()">🛒 新增購物項目</button>
                    <ul class="shopping-list">
            `;
            
            currentState.shoppingList.forEach(item => {
                const purchasedClass = item.purchased ? 'purchased' : '';
                const imageHtml = item.imageUrl && item.imageUrl !== 'N/A' ? 
                    `<img src="${item.imageUrl}" alt="${item.name}" class="shopping-image-preview">` : 
                    `<div class="shopping-image-preview image-placeholder">無圖</div>`;
                
                html += `
                    <li class="shopping-item ${purchasedClass}" id="shopping-item-${item.id}">
                        <input type="checkbox" class="shopping-checkbox" ${item.purchased ? 'checked' : ''} onclick="togglePurchased(${item.id})">
                        ${imageHtml}
                        <div class="shopping-details" onclick="openShoppingModalForEdit(${item.id})" style="cursor:pointer;">
                            <div class="shopping-name">${item.name}</div>
                            <small>${item.target}</small>
                        </div>
                        <button class="shopping-delete-btn" onclick="deleteShoppingItem(${item.id})">✖</button>
                    </li>
                `;
            });
            
            html += `
                    </ul>
                </div>
            `;
            return html;
        }

        // 渲染花費頁面 (使用新設計：App 卡片列表)
        function renderExpenseTab() {
            const totalJPY = currentState.expenses.reduce((acc, exp) => acc + exp.price, 0);
            
            let expenseHtml = `
                <div class="expense-tab">
                    <div class="total-box">
                        <h3>總花費 (日幣)</h3>
                        <span class="total-jpy-amount">¥ ${totalJPY.toLocaleString()}</span>
                        <button class="add-expense-btn" onclick="openExpenseModalForNew()">+ 記錄花費</button>
                    </div>

                    <ul class="expense-list">
                        ${currentState.expenses.sort((a, b) => a.date.localeCompare(b.date)).map(expense => `
                            <li class="expense-card" onclick="openExpenseModalForEdit(${expense.id})">
                                <div class="expense-details">
                                    <div class="expense-item-name">${expense.item}</div>
                                    <div class="expense-meta">
                                        <span class="expense-date">${expense.date}</span>
                                        • <span class="expense-category-tag">${expenseCategories[expense.category] || '其他'}</span>
                                    </div>
                                </div>
                                <div class="expense-amount">¥ ${expense.price.toLocaleString()}</div>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;
            return expenseHtml;
        }

        // ******************************************************
        // *** 操作邏輯 ***
        // ******************************************************

        function toggleDetails(id) {
            const dayData = currentState.tripData.find(day => day.date === currentState.currentDay);
            const activity = dayData.details.find(a => a.id == id);
            if (activity) {
                activity.showDetails = !activity.showDetails;
                renderApp();
            }
        }

        function moveActivity(date, id, direction) {
            const dayData = currentState.tripData.find(day => day.date === date);
            const index = dayData.details.findIndex(a => a.id == id);
            
            if (index !== -1) {
                const newIndex = index + direction;

                if (newIndex >= 0 && newIndex < dayData.details.length) {
                    const activity = dayData.details.splice(index, 1)[0];
                    dayData.details.splice(newIndex, 0, activity);
                    renderApp(); 
                }
            }
        }
        
        // --- 行程 Modal ---
        function openModal(activity = null, date = currentState.currentDay) {
            document.getElementById('activity-date').value = date;
            const form = document.getElementById('activity-form');
            document.getElementById('delete-activity-btn').style.display = activity ? 'inline-block' : 'none';
            document.getElementById('modal-container').style.display = 'flex';
            
            if (activity) {
                document.getElementById('modal-title').textContent = '編輯活動';
                document.getElementById('activity-id').value = activity.id;
                document.getElementById('activity-title').value = activity.title;
                document.getElementById('activity-time').value = activity.time;
                document.getElementById('activity-location').value = activity.location || '';
                document.getElementById('activity-travel-time').value = activity.travelTime || '';
                document.getElementById('activity-ticket').value = activity.ticket || '無';
                document.getElementById('activity-feature').value = activity.feature || '';
                document.getElementById('activity-category').value = activity.category || 'other'; 
            } else {
                document.getElementById('modal-title').textContent = '新增活動';
                form.reset();
                document.getElementById('activity-id').value = '';
                document.getElementById('activity-category').value = 'sightseeing'; 
            }
        }

        function closeModal() {
            document.getElementById('modal-container').style.display = 'none';
            document.getElementById('activity-form').reset();
        }

        function openModalForEdit(id, date) {
            const dayData = currentState.tripData.find(day => day.date === date);
            const activity = dayData.details.find(a => a.id == id);
            if (activity) {
                openModal(activity, date);
            }
        }

        function openModalForNew(date) {
            openModal(null, date);
        }

        document.getElementById('activity-form').onsubmit = function(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const id = formData.get('id');
            const date = formData.get('date');

            const newActivity = {
                id: id ? parseInt(id) : ++lastActivityId,
                title: formData.get('title'),
                time: formData.get('time'),
                ticket: formData.get('ticket'),
                feature: formData.get('feature'),
                location: formData.get('location'),
                travelTime: formData.get('travelTime'),
                category: formData.get('category') || 'other', 
                showDetails: true
            };

            const dayData = currentState.tripData.find(day => day.date === date);
            if (dayData) {
                if (id) {
                    const index = dayData.details.findIndex(a => a.id == id);
                    if (index !== -1) {
                        dayData.details[index] = newActivity;
                    }
                } else {
                    dayData.details.push(newActivity);
                    dayData.details.sort((a, b) => (a.time || 'ZZZZZ').localeCompare(b.time || 'ZZZZZ')); 
                }
            }

            closeModal();
            updateState({});
        };

        function deleteActivity(id, date) {
            if (confirm('確定要刪除這筆行程嗎？')) {
                const dayData = currentState.tripData.find(day => day.date === date);
                if (dayData) {
                    dayData.details = dayData.details.filter(a => a.id != id);
                    closeModal();
                    updateState({});
                }
            }
        }

        // --- 購物清單 Modal 相關 ---
        
        function openShoppingModal(item = null) {
            const form = document.getElementById('shopping-form');
            const previewImg = document.getElementById('shopping-image-preview-img');
            const deleteBtn = document.getElementById('delete-shopping-btn');
            
            document.getElementById('shopping-modal-container').style.display = 'flex';
            deleteBtn.style.display = item ? 'inline-block' : 'none';
            
            if (item) {
                document.getElementById('shopping-modal-title').textContent = '編輯購物項目';
                document.getElementById('shopping-id').value = item.id;
                document.getElementById('shopping-name').value = item.name;
                document.getElementById('shopping-target').value = item.target || '';
                document.getElementById('shopping-image-url').value = item.imageUrl && item.imageUrl !== 'N/A' ? item.imageUrl : '';
                previewImg.src = item.imageUrl && item.imageUrl !== 'N/A' ? item.imageUrl : 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
                previewImg.className = item.imageUrl && item.imageUrl !== 'N/A' ? 'shopping-image-preview' : 'shopping-image-preview image-placeholder';

            } else {
                document.getElementById('shopping-modal-title').textContent = '新增購物項目';
                form.reset();
                document.getElementById('shopping-id').value = '';
                previewImg.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
                previewImg.className = 'shopping-image-preview image-placeholder';
            }
            
            document.getElementById('shopping-image-url').oninput = function() {
                previewImg.src = this.value || 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
                previewImg.className = this.value ? 'shopping-image-preview' : 'shopping-image-preview image-placeholder';
            };
        }
        
        function closeShoppingModal() {
            document.getElementById('shopping-modal-container').style.display = 'none';
        }

        function openShoppingModalForNew() {
            openShoppingModal(null);
        }

        function openShoppingModalForEdit(id) {
            const item = currentState.shoppingList.find(s => s.id == id);
            if (item) {
                openShoppingModal(item);
            }
        }
        
        document.getElementById('shopping-form').onsubmit = function(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const id = formData.get('id');

            const newItem = {
                id: id ? parseInt(id) : ++lastShoppingId,
                name: formData.get('name'),
                target: formData.get('target'),
                imageUrl: formData.get('imageUrl') || 'N/A',
                purchased: id ? currentState.shoppingList.find(s => s.id == id).purchased : false 
            };

            if (id) {
                const index = currentState.shoppingList.findIndex(s => s.id == id);
                if (index !== -1) {
                    currentState.shoppingList[index] = newItem;
                }
            } else {
                currentState.shoppingList.push(newItem);
            }

            closeShoppingModal();
            updateState({ currentTab: 'shopping' });
        };
        
        function togglePurchased(id) {
            const item = currentState.shoppingList.find(s => s.id == id);
            if (item) {
                item.purchased = !item.purchased;
                updateState({ currentTab: 'shopping' });
            }
        }
        
        function deleteShoppingItem(id) {
            if (confirm('確定要刪除這筆購物清單項目嗎？')) {
                currentState.shoppingList = currentState.shoppingList.filter(e => e.id != id);
                closeShoppingModal();
                updateState({ currentTab: 'shopping' }); 
            }
        }

        // --- 花費 Modal 相關 ---
        function openExpenseModalForNew() {
             document.getElementById('expense-modal-title').textContent = '新增花費';
             document.getElementById('expense-form').reset();
             document.getElementById('expense-id').value = '';
             document.getElementById('delete-expense-btn').style.display = 'none';
             // 預設日期為當前選擇日期的月份，日為今日
             const today = new Date();
             const month = (today.getMonth() + 1).toString().padStart(2, '0');
             const day = today.getDate().toString().padStart(2, '0');
             document.getElementById('expense-date').value = `${today.getFullYear()}-${month}-${day}`;
             document.getElementById('expense-modal-container').style.display = 'flex';
        }
        
        function closeExpenseModal() {
             document.getElementById('expense-modal-container').style.display = 'none';
        }
        
        function openExpenseModalForEdit(id) {
            const expense = currentState.expenses.find(e => e.id == id);
            if (expense) {
                document.getElementById('expense-modal-title').textContent = '編輯花費';
                document.getElementById('expense-id').value = expense.id;
                // 為了讓 date 欄位正常顯示，需補上年份 (假設為 2024)
                document.getElementById('expense-date').value = `2024-${expense.date}`; 
                document.getElementById('expense-item').value = expense.item;
                document.getElementById('expense-category').value = expense.category;
                document.getElementById('expense-price').value = expense.price;
                document.getElementById('delete-expense-btn').style.display = 'inline-block';
                document.getElementById('expense-modal-container').style.display = 'flex';
            }
        }

        document.getElementById('expense-form').onsubmit = function(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const id = formData.get('id');

            const newExpense = {
                id: id ? parseInt(id) : ++lastExpenseId,
                date: formData.get('date').substring(5), // 將 YYYY-MM-DD 轉為 MM-DD 儲存
                item: formData.get('item'),
                category: formData.get('category'),
                price: parseInt(formData.get('price')),
                currency: 'JPY'
            };

            if (id) {
                const index = currentState.expenses.findIndex(e => e.id == id);
                if (index !== -1) {
                    currentState.expenses[index] = newExpense;
                }
            } else {
                currentState.expenses.push(newExpense);
            }

            closeExpenseModal();
            updateState({ currentTab: 'expense' }); 
        };
        
        function deleteExpense(id) {
            if (confirm('確定要刪除這筆花費記錄嗎？')) {
                currentState.expenses = currentState.expenses.filter(e => e.id != id);
                closeExpenseModal();
                updateState({ currentTab: 'expense' }); 
            }
        }
        
        // --- 初始化 ---
        renderApp();
        
        // 暴露核心函式
        window.updateState = updateState;
        window.toggleDetails = toggleDetails;
        window.openModalForEdit = openModalForEdit;
        window.openModalForNew = openModalForNew;
        window.closeModal = closeModal;
        window.deleteActivity = deleteActivity;
        window.moveActivity = moveActivity;
        window.openExpenseModalForNew = openExpenseModalForNew;
        window.openExpenseModalForEdit = openExpenseModalForEdit;
        window.closeExpenseModal = closeExpenseModal;
        window.deleteExpense = deleteExpense;
        window.openShoppingModalForNew = openShoppingModalForNew;
        window.openShoppingModalForEdit = openShoppingModalForEdit;
        window.closeShoppingModal = closeShoppingModal;
        window.togglePurchased = togglePurchased;
        window.deleteShoppingItem = deleteShoppingItem;
    </script>
</body>
</html>
