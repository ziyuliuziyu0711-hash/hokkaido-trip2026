<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 森林小葵家 | 北海道親子遊七天六夜行程 </title>
    <link rel="stylesheet" href="style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='20' fill='%23000'%3E%F0%9F%8C%B5%3C/text%3E%3C/svg%3E" type="image/svg+xml">
</head>
<body>
    <header>
        <h1> 🌲 森林小葵家 🌻 </h1>
        <p class="subtitle">北海道七天六夜親子行程規劃</p>
    </header>
    
    <div id="app">
        </div>
    
    <div id="modal-container" class="modal-container">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">新增活動</h2>
            <form id="activity-form">
                <input type="hidden" id="activity-id">
                <input type="hidden" id="activity-date">
                
                <label for="activity-category">分類</label>
                <select id="activity-category" name="category" required>
                    <option value="sightseeing">景點</option>
                    <option value="transportation">交通</option>
                    <option value="flight">航班</option>
                    <option value="food">美食</option>
                    <option value="shopping">購物</option>
                    <option value="other">其他</option>
                </select>
                
                <label for="activity-title">活動名稱</label>
                <input type="text" id="activity-title" name="title" required>
                
                <label for="activity-time">預計時間</label>
                <input type="text" id="activity-time" name="time" value="TBD">
                
                <label for="activity-location">地點名稱 (用於導航)</label>
                <input type="text" id="activity-location" name="location" required>
                
                <label for="activity-travel-time">前一站至此站交通時間/方式</label>
                <input type="text" id="activity-travel-time" name="travelTime" placeholder="例如：開車約 15 分鐘 / 地鐵 5 站">

                <label for="activity-ticket">門票/費用</label>
                <input type="text" id="activity-ticket" name="ticket" value="無">
                
                <label for="activity-feature">備註/特色 (支援換行)</label>
                <textarea id="activity-feature" name="feature"></textarea>
                
                <div class="form-actions">
                    <button type="button" class="delete-btn" onclick="deleteActivity(document.getElementById('activity-id').value, document.getElementById('activity-date').value)" style="display:none;" id="delete-activity-btn">刪除</button>
                    <button type="submit" class="save-btn">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="expense-modal-container" class="modal-container">
        <div class="modal-content">
            <span class="close-btn" onclick="closeExpenseModal()">&times;</span>
            <h2 id="expense-modal-title">新增花費</h2>
            <form id="expense-form">
                <input type="hidden" id="expense-id">
                
                <label for="expense-date">日期</label>
                <input type="date" id="expense-date" name="date" required>

                <label for="expense-item">項目名稱</label>
                <input type="text" id="expense-item" name="item" required>

                <label for="expense-category">類別</label>
                <select id="expense-category" name="category" required>
                    <option value="food">飲食</option>
                    <option value="transport">交通 (車資/油錢)</option>
                    <option value="attraction">門票/體驗</option>
                    <option value="shopping">購物</option>
                    <option value="housing">住宿</option>
                    <option value="other">其他</option>
                </select>

                <label for="expense-price">金額 (日幣)</label>
                <input type="number" id="expense-price" name="price" required min="0">

                <div class="form-actions">
                    <button type="button" class="delete-btn" onclick="deleteExpense(document.getElementById('expense-id').value)" style="display:none;" id="delete-expense-btn">刪除</button>
                    <button type="submit" class="save-btn">儲存</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="shopping-modal-container" class="modal-container">
        <div class="modal-content">
            <span class="close-btn" onclick="closeShoppingModal()">&times;</span>
            <h2 id="shopping-modal-title">新增購物項目</h2>
            <form id="shopping-form">
                <input type="hidden" id="shopping-id">
                
                <label for="shopping-name">商品名稱</label>
                <input type="text" id="shopping-name" name="name" required>
                
                <label for="shopping-target">預計購買地點/備註</label>
                <input type="text" id="shopping-target" name="target" placeholder="例如：機場免稅店/藥妝店">

                <label>圖片 URL</label>
                <div class="image-preview-area">
                    <img id="shopping-image-preview-img" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="預覽" class="shopping-image-preview image-placeholder" style="width:60px;height:60px;">
                    <input type="text" id="shopping-image-url" class="url-input" name="imageUrl" placeholder="輸入圖片 URL...">
                </div>
                
                <div class="form-actions">
                    <button type="button" class="delete-btn" onclick="deleteShoppingItem(document.getElementById('shopping-id').value)" style="display:none;" id="delete-shopping-btn">刪除</button>
                    <button type="submit" class="save-btn">儲存</button>
                </div>
            </form>
        </div>
    </div>
