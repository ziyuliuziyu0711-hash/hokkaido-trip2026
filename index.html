        // --- 渲染子函式 ---

        function renderActivityDetails(item, dayIndex, itemIndex) {
            const detailKey = `${dayIndex}-${itemIndex}`;
            const isExpanded = currentState.expandedDetails[detailKey];
            
            const mapLink = getMapLink(item.location);
            
            // 如果 location 存在，將 title 渲染為可導航的連結
            const locationLink = mapLink 
                ? `<a href="${mapLink}" target="_blank" rel="noopener noreferrer" class="location-link">${item.title} 📍</a>`
                : item.title;
            
            // 篩選出有效的值
            const detailsList = [
                { label: '⏰ 營業時間', value: item.time },
                { label: '🎫 門票費用', value: item.ticket },
                { label: '🌟 特色&備註', value: item.feature },
            ].filter(d => d.value && d.value.trim() !== '' && d.value.trim() !== '無'); 

            // 將 feature 內容中的分號替換為換行符，使文字更易閱讀
            const formattedFeature = item.feature ? item.feature.replace(/：/g, ': ').replace(/。/g, '。\n').replace(/；/g, '；\n') : '';

            // 根據篩選後的列表渲染 HTML
            const detailsHtml = detailsList.length > 0 && isExpanded
                ? `<ul class="detail-list">
                    ${detailsList.map(d => {
                        // 特色/備註單獨處理，使用 <pre> 保持格式
                        if (d.label === '🌟 特色&備註') {
                            return `<li class="feature-item"><span class="detail-label">🌟 完整特色/備註</span>: <pre>${formattedFeature}</pre></li>`;
                        } else {
                            return `<li><span class="detail-label">${d.label}</span>: ${d.value}</li>`;
                        }
                    }).join('')}
                   </ul>`
                : '';
            
            const expandButton = detailsList.length > 0
                ? `<button class="expand-btn" onclick="toggleDetails('${detailKey}')">${isExpanded ? '▲ 收起細節' : '▼ 詳細資訊'}</button>`
                : '';
            
            // 行程排序與編輯按鈕
            const controls = `
                <div class="activity-controls">
                    ${expandButton}
                    <button class="menu-btn edit-btn" onclick="openModalForEdit(${dayIndex}, ${itemIndex})">⚙️</button>
                    ${itemIndex > 0 ? `<button class="menu-btn sort-btn" onclick="moveActivity(${dayIndex}, ${itemIndex}, -1)">⬆️</button>` : ''}
                    ${itemIndex < currentState.trip[dayIndex].details.length - 1 ? `<button class="menu-btn sort-btn" onclick="moveActivity(${dayIndex}, ${itemIndex}, 1)">⬇️</button>` : ''}
                </div>
            `;

            return `
                <li class="activity-item" data-id="${item.id}">
                    <div class="activity-content">
                        <div class="description-wrap">
                            ${locationLink}
                        </div>
                    </div>
                    ${controls}
                    ${detailsHtml}
                </li>
            `;
        }


        function renderDayCard(day, dayIndex) {
            let activitiesHtml = '';
            day.details.forEach((item, itemIndex) => {
                
                // 1. 渲染到達當前地點的交通時間
                if (item.travelTime && item.travelTime.trim() !== '' && item.travelTime.trim() !== '無') {
                    // 判斷是否為步行，決定使用的圖標 
                    const transportIcon = item.travelTime.includes('步行') ? '🚶' : '🚗';
                    
                    // 交通時間現在渲染在行程內容 (Activity Item) 上方
                    activitiesHtml += `<p class="travel-time travel-to-item"><span class="icon">${transportIcon}</span> ${item.travelTime}</p>`;
                }

                // 2. 渲染當前行程內容 (Activity Item)
                activitiesHtml += renderActivityDetails(item, dayIndex, itemIndex);
            });
            
            // 渲染過路費欄位
            const tollHtml = day.dailyTollEstimate 
                ? `<div class="toll-estimate">💸 預估過路費: ${day.dailyTollEstimate}</div>`
                : '';

            return `
                <div class="day-card">
                    <h2 class="card-title">${day.icon} ${day.title}</h2>
                    
                    <div class="weather-box">
                        <span class="weather-icon">${day.weather.icon}</span>
                        <div class="weather-info">
                            <p>天氣: ${day.weather.desc}</p>
                            <p>溫度: ${day.weather.temp}</p>
                        </div>
                    </div>

                    ${tollHtml}

                    <ul class="activity-list">
                        ${activitiesHtml}
                    </ul>
                    <button class="add-item-btn" onclick="openModalForNew(${dayIndex})">+ 新增行程項目</button>
                </div>
            `;
        }
        
        function renderInfoTab() {
            const flightsHtml = infoData.flights.map(f => `
                <div class="info-item flight-item">
                    <span class="info-label">航班編號</span>
                    <p class="info-value">✈️ ${f.flight} (${f.type})</p>
                    <p class="info-route">${f.route}</p>
                </div>
            `).join('');

            const hotelsHtml = infoData.hotels.map(h => `
                <div class="info-item hotel-item">
                    <span class="info-label">入住期間：${h.dates}</span>
                    <p class="info-value">🏨 <a href="${getMapLink(h.location)}" target="_blank" rel="noopener noreferrer">${h.name}</a></p>
                </div>
            `).join('');
            
            // 渲染租車資訊
            const carRentalHtml = `
                <div class="info-group car-group">
                    <div class="info-item car-item">

                        <p class="info-value">🚗 取車：${infoData.carRental.pickup}</p>
                        <p class="info-value">🗝️ 還車：${infoData.carRental.dropoff}</p>

            return `

                    <h2>🏨 住宿資訊</h2>
                    <div class="info-group hotel-group">

                    </div>
                    <h2>🔑 自駕租車資訊</h2>
                    ${carRentalHtml}
                </div>
            `;
        }
        
        function renderExpenseTab() {
            // 假設所有花費都是日圓，計算總和
            const totalJpy = currentState.expenses.reduce((sum, item) => sum + item.price, 0);
            
            // 確保 expenses 根據日期排序，最新的在前面
            const sortedExpenses = [...currentState.expenses].sort((a, b) => {
                // 為了排序，假設年份為 2024
                const dateA = new Date('2024-' + a.date);
                const dateB = new Date('2024-' + b.date);
                return dateA - dateB; // 升序排列
            }).reverse(); // 反轉為降序 (最新在最上面)

            const rowsHtml = sortedExpenses.map(e => `
                <tr>
                    <td>${e.date || 'N/A'}</td> 
                    <td class="expense-price">${e.price.toLocaleString('ja-JP')} ${e.currency}</td>
                    <td>${e.method}</td>
                    <td>${e.category}</td>
                    <td>${e.note}</td>
                    <td><button onclick="deleteExpense(${e.id})" class="delete-btn-sm">× 刪除</button></td>
                </tr>
            `).join('');

            return `
                <div class="expense-tab">
                    <div class="total-box">
                        <h3>總記錄花費： <span class="total-jpy-amount">${totalJpy.toLocaleString('ja-JP')} JPY</span></h3>
                        <button class="add-expense-btn" onclick="openExpenseModal()">+ 新增花費</button>
                    </div>
                    
                    <div class="table-scroll-wrapper">
                        <table class="expense-table">
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>價格</th>
                                    <th>支付</th>
                                    <th>分類</th>
                                    <th>備註</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHtml}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // 核心渲染函式
        function renderApp() {
            const state = currentState;
            
            let mainContent = '';
            
            // 頂部導航欄 (Tab Navigator)
            const tabNavHtml = `
                <nav class="main-tab-nav">
                    <button class="main-tab-btn ${state.currentTab === 'trip' ? 'active' : ''}" onclick="updateState({ currentTab: 'trip', currentDay: 0 })">🗺️ 行程</button>
                    <button class="main-tab-btn ${state.currentTab === 'info' ? 'active' : ''}" onclick="updateState({ currentTab: 'info' })">ℹ️ 資訊</button>
                    <button class="main-tab-btn ${state.currentTab === 'expense' ? 'active' : ''}" onclick="updateState({ currentTab: 'expense' })">💰 花費</button>
                </nav>
            `;

            if (state.currentTab === 'info') {
                mainContent = renderInfoTab();
            } else if (state.currentTab === 'expense') {
                mainContent = renderExpenseTab();
            } else {
                // Trip Tab
                const currentDayData = state.trip[state.currentDay];
                
                // 日期選擇導航
                const dayNavButtonsHtml = state.trip.map((day, index) => {
                    const isActive = state.currentDay === index ? 'active' : '';
                    const dayString = day.day; 
                    const dateString = day.date.split('/')[1]; 
                    
                    return `<button class="nav-button ${isActive}" onclick="updateState({ currentDay: ${index} })">
                                <span class="nav-day">${dayString}</span>
                                <span class="nav-date">${dateString}</span>
                            </button>`;
                }).join('');
                
                const dayDetailHtml = renderDayCard(currentDayData, state.currentDay);

                mainContent = `
                    <nav class="day-nav">
                        ${dayNavButtonsHtml}
                    </nav>
                    <div class="day-detail-area">
                        ${dayDetailHtml}
                    </div>
                `;
            }
            
            appContainer.innerHTML = `
                ${tabNavHtml}
                <div class="main-content-area">
                    ${mainContent}
                </div>
            `;
            
            // 每次渲染後確保天氣資訊的載入
            // loadWeather(); 
        }

        // 狀態更新函式 (重新渲染頁面)
        function updateState(newState) {
            currentState = { ...currentState, ...newState };
            renderApp();
            // 在狀態變更後，如果切換回行程頁面，確保滾動到當前日期
            if (currentState.currentTab === 'trip' && newState.currentDay !== undefined) {
                scrollToActiveDay(newState.currentDay);
            }
        }
        
        // --- 行程細節控制函式 ---
        
        function toggleDetails(detailKey) {
            // 複製 expandedDetails 物件
            const newExpandedDetails = { ...currentState.expandedDetails };

            // 切換狀態
            if (newExpandedDetails[detailKey]) {
                delete newExpandedDetails[detailKey];
            } else {
                newExpandedDetails[detailKey] = true;
            }

            // 更新狀態並重新渲染
            updateState({ expandedDetails: newExpandedDetails });
        }
        
        function scrollToActiveDay(dayIndex) {
            const dayNav = document.querySelector('.day-nav');
            const activeDayButton = document.querySelector(`.day-nav .nav-button:nth-child(${dayIndex + 1})`);
            
            if (dayNav && activeDayButton) {
                // 計算需要滾動到的位置：按鈕左邊緣 - 導航欄寬度的一半 + 按鈕寬度的一半
                const scrollPosition = activeDayButton.offsetLeft - (dayNav.offsetWidth / 2) + (activeDayButton.offsetWidth / 2);
                
                dayNav.scrollTo({
                    left: scrollPosition,
                    behavior: 'smooth'
                });
            }
        }

        // --- 行程編輯 Modal 邏輯 ---

        function openModalForEdit(dayIndex, itemIndex) {
            const day = currentState.trip[dayIndex];
            const item = day.details[itemIndex];
            
            currentState.editingItem = { dayIndex, itemIndex, isNew: false };
            
            // 填充表單 HTML
            activityForm.innerHTML = `
                <input type="hidden" name="id" value="${item.id}">
                
                <label for="title">活動名稱:</label>
                <input type="text" id="title" name="title" value="${item.title}" required>

                <label for="time">時間/時段:</label>
                <input type="text" id="time" name="time" value="${item.time || ''}">

                <label for="location">地點名稱 (地圖搜尋):</label>
                <input type="text" id="location" name="location" value="${item.location || ''}">
                
                <label for="travelTime">交通時間 (來自前一站):</label>
                <input type="text" id="travelTime" name="travelTime" value="${item.travelTime || ''}">

                <label for="ticket">門票/費用:</label>
                <input type="text" id="ticket" name="ticket" value="${item.ticket || '無'}">

                <label for="feature">特色/備註:</label>
                <textarea id="feature" name="feature">${item.feature || ''}</textarea>
                
                <div class="form-actions">
                    <button type="submit" class="save-btn">儲存修改</button>
                    <button type="button" class="delete-btn" onclick="deleteActivity(${dayIndex}, ${itemIndex})">刪除此項目</button>
                </div>
            `;
            
            modalContainer.style.display = 'flex';
        }
        
        function openModalForNew(dayIndex) {
            currentState.editingItem = { dayIndex, itemIndex: null, isNew: true };
            
            activityForm.innerHTML = `
                <h2>新增行程項目 (Day ${dayIndex + 1})</h2>
                
                <label for="title">活動名稱:</label>
                <input type="text" id="title" name="title" value="" required>

                <label for="time">時間/時段:</label>
                <input type="text" id="time" name="time" value="TBD">

                <label for="location">地點名稱 (地圖搜尋):</label>
                <input type="text" id="location" name="location" value="">
                
                <label for="travelTime">交通時間 (來自前一站):</label>
                <input type="text" id="travelTime" name="travelTime" value="">

                <label for="ticket">門票/費用:</label>
                <input type="text" id="ticket" name="ticket" value="無">

                <label for="feature">特色/備註:</label>
                <textarea id="feature" name="feature"></textarea>
                
                <div class="form-actions">
                    <button type="submit" class="save-btn">新增項目</button>
                </div>
            `;
            
            modalContainer.style.display = 'flex';
        }

        function closeModal() {
            modalContainer.style.display = 'none';
            currentState.editingItem = null;
        }

        activityForm.onsubmit = function(event) {
            event.preventDefault();
            
            const formData = new FormData(activityForm);
            const newItem = {};
            for (let [key, value] of formData.entries()) {
                newItem[key] = value.trim();
            }
            
            const { dayIndex, itemIndex, isNew } = currentState.editingItem;
            
            if (isNew) {
                // 產生一個新的 ID (簡單的隨機 ID)
                newItem.id = Date.now() + Math.floor(Math.random() * 1000);
                currentState.trip[dayIndex].details.push(newItem);
            } else {
                // 編輯現有項目
                // 確保 id 被正確轉換成數字
                newItem.id = Number(newItem.id); 
                currentState.trip[dayIndex].details[itemIndex] = newItem;
            }
            
            closeModal();
            updateState({}); // 重新渲染
        };
        
        function deleteActivity(dayIndex, itemIndex) {
            if (confirm('確定要刪除此行程項目嗎？')) {
                currentState.trip[dayIndex].details.splice(itemIndex, 1);
                closeModal();
                updateState({}); // 重新渲染
            }
        }
        
        function moveActivity(dayIndex, itemIndex, direction) {
            const dayDetails = currentState.trip[dayIndex].details;
            const newIndex = itemIndex + direction;
            
            if (newIndex >= 0 && newIndex < dayDetails.length) {
                // 執行移動操作
                const itemToMove = dayDetails.splice(itemIndex, 1)[0];
                dayDetails.splice(newIndex, 0, itemToMove);
                updateState({}); // 重新渲染
            }
        }

        // --- 花費 Modal 邏輯 ---
        
        function openExpenseModal() {
            // 取得今日日期 YYYY-MM-DD 格式
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const todayDate = `${year}-${month}-${day}`;
            
            expenseForm.innerHTML = `
                <div class="form-group">
                    <label for="expense-date">日期:</label>
                    <input type="date" id="expense-date" name="date" value="${todayDate}" required>
                </div>

                <div class="form-group">
                    <label for="price">價格 (JPY):</label>
                    <input type="number" id="price" name="price" required min="1" placeholder="輸入日圓價格">
                </div>

                <div class="form-group">
                    <label for="category">分類:</label>
                    <select id="category" name="category" required>
                        <option value="餐飲">餐飲 🍜</option>
                        <option value="交通">交通 🚗</option>
                        <option value="門票">門票 🎫</option>
                        <option value="購物">購物 🛍️</option>
                        <option value="住宿">住宿 🏨</option>
                        <option value="雜項">雜項 💡</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="method">支付方式:</label>
                    <select id="method" name="method" required>
                        <option value="現金">現金 💵</option>
                        <option value="刷卡">刷卡 💳</option>
                        <option value="電子支付">電子支付 📲</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="note">備註/品項:</label>
                    <input type="text" id="note" name="note" placeholder="例如：拉麵、水族館門票">
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="save-btn">記錄花費</button>
                </div>
            `;
            
            expenseModalContainer.style.display = 'flex';
        }
        
        function closeExpenseModal() {
            expenseModalContainer.style.display = 'none';
        }
        
        expenseForm.onsubmit = function(event) {
            event.preventDefault();
            
            const formData = new FormData(expenseForm);
            const newExpense = {
                id: Date.now() + Math.floor(Math.random() * 1000),
                currency: 'JPY'
            };

            for (let [key, value] of formData.entries()) {
                if (key === 'date') {
                    // 將 YYYY-MM-DD 轉為 MM-DD 儲存
                    newExpense[key] = value.substring(5); 
                } else if (key === 'price') {
                    newExpense[key] = parseInt(value);
                } else {
                    newExpense[key] = value.trim();
                }
            }

            currentState.expenses.push(newExpense);
            closeExpenseModal();
            updateState({ currentTab: 'expense' }); // 確保切換到花費頁面並重新渲染
        };
        
        function deleteExpense(id) {
            if (confirm('確定要刪除這筆花費記錄嗎？')) {
                currentState.expenses = currentState.expenses.filter(e => e.id !== id);
                updateState({ currentTab: 'expense' }); // 重新渲染花費頁面
            }
        }
        
        // --- 初始化 ---
        renderApp();
        // 將核心函式暴露給全域環境，以便 HTML 中的 onclick 事件可以調用
        window.updateState = updateState;
        window.toggleDetails = toggleDetails;
        window.openModalForEdit = openModalForEdit;
        window.openModalForNew = openModalForNew;
        window.closeModal = closeModal;
        window.deleteActivity = deleteActivity;
        window.moveActivity = moveActivity;
        window.openExpenseModal = openExpenseModal;
        window.closeExpenseModal = closeExpenseModal;
        window.deleteExpense = deleteExpense;

    </script>
