<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❄️ 森林家北海道七天六夜行程 ❄️</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='20' fill='%23000'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    
    <style>
        :root {
            --primary-color: #004d40; /* 深綠色 */
            --secondary-color: #fdd835; /* 黃色 */
            --background-light: #f4f6f8;
            --background-dark: #e0f2f1; /* 淺綠背景 */
            --text-dark: #263238;
            --text-light: #ffffff;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--background-light);
            color: var(--text-dark);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            padding-bottom: 50px; /* 避免底部遮擋 */
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), #4db6ac);
            color: var(--text-light);
            padding: 20px 15px;
            text-align: center;
            box-shadow: var(--box-shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 1.8em;
            font-weight: 700;
        }

        .subtitle {
            margin: 0;
            font-size: 0.9em;
            font-weight: 300;
            opacity: 0.9;
        }

        #app {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }
        
        /* --- Tab Navigation --- */
        .main-tab-nav {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            background-color: var(--text-light);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
        }
        
        .main-tab-btn {
            flex-grow: 1;
            padding: 10px 15px;
            border: none;
            background-color: var(--text-light);
            color: var(--primary-color);
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            font-weight: 500;
        }
        
        .main-tab-btn.active {
            background-color: var(--primary-color);
            color: var(--text-light);
            font-weight: 700;
        }
        
        .main-tab-btn:hover:not(.active) {
            background-color: #e0f7fa;
        }
        
        /* --- Trip Tab: Day Navigation --- */
        .day-nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            margin-bottom: 20px;
            padding-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .nav-button {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 70px;
            height: 65px;
            padding: 5px 10px;
            margin-right: 8px;
            border: 2px solid var(--primary-color);
            border-radius: var(--border-radius);
            background-color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-button.active {
            background-color: var(--primary-color);
            color: var(--text-light);
            box-shadow: var(--box-shadow);
        }
        
        .nav-button:not(.active):hover {
            background-color: var(--background-dark);
        }

        .nav-day {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .nav-date {
            font-size: 1.4em;
            font-weight: 700;
        }

        /* --- Trip Tab: Day Card --- */
        .day-card {
            background-color: var(--text-light);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }

        .card-title {
            font-size: 1.5em;
            font-weight: 700;
            margin-top: 0;
            border-bottom: 2px solid #eceff1;
            padding-bottom: 10px;
        }

        /* Weather Box */
        .weather-box {
            display: flex;
            align-items: center;
            background-color: #e3f2fd; /* 淺藍色 */
            padding: 10px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .weather-icon {
            font-size: 1.8em;
            margin-right: 10px;
        }

        .weather-info p {
            margin: 0;
        }
        
        /* Toll Estimate */
        .toll-estimate {
            background-color: #ffebee; /* 淺紅色 */
            color: #c62828;
            padding: 8px 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.9em;
        }

        /* Activity List */
        .activity-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .travel-time {
            background-color: #cfd8dc;
            color: var(--text-dark);
            padding: 6px 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.85em;
            display: flex;
            align-items: center;
        }
        
        .travel-time .icon {
            margin-right: 5px;
            font-size: 1.1em;
        }

        .activity-item {
            border: 1px solid #e0e0e0;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
            padding: 15px;
            position: relative;
            background-color: var(--background-light);
            transition: box-shadow 0.2s;
        }
        
        .activity-item:hover {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .activity-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .description-wrap {
            font-weight: 700;
            font-size: 1.1em;
            line-height: 1.3;
            flex-grow: 1;
            padding-right: 120px; /* 留出控制按鈕空間 */
        }
        
        .location-link {
            color: var(--primary-color);
            text-decoration: none;
            border-bottom: 2px dotted var(--primary-color);
            transition: color 0.2s;
        }
        
        .location-link:hover {
            color: #00796b;
        }

        /* Activity Controls (Menu Buttons) */
        .activity-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
        }

        .menu-btn {
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            transition: background-color 0.2s;
        }
        
        .menu-btn:hover {
            background-color: #e0e0e0;
        }
        
        .edit-btn {
            font-size: 1em; /* 讓編輯圖示大一點 */
        }
        
        .expand-btn {
            background-color: var(--secondary-color);
            color: var(--text-dark);
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 500;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        
        .expand-btn:hover {
            background-color: #ffb300;
        }

        /* Detail List */
        .detail-list {
            list-style: none;
            padding: 10px 0 0 0;
            margin-top: 10px;
            border-top: 1px dashed #bdbdbd;
            font-size: 0.9em;
        }

        .detail-list li {
            margin-bottom: 5px;
        }
        
        .detail-label {
            font-weight: 700;
            color: var(--primary-color);
            margin-right: 5px;
            min-width: 80px;
            display: inline-block;
        }
        
        .feature-item {
            margin-top: 8px;
        }
        
        .feature-item pre {
            white-space: pre-wrap; /* 保持換行和空格 */
            font-family: inherit;
            margin: 5px 0 0 0;
            padding: 5px;
            background-color: #f9f9f9;
            border-left: 3px solid var(--primary-color);
        }

        .add-item-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #4db6ac;
            color: var(--text-light);
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .add-item-btn:hover {
            background-color: #26a69a;
        }

        /* --- Info Tab --- */
        .info-tab {
            padding: 20px;
            background-color: var(--text-light);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
        
        .info-tab h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 5px;
            margin-top: 20px;
            font-size: 1.4em;
            font-weight: 700;
        }
        
        .info-tab h2:first-child {
            margin-top: 0;
        }

        .info-group {
            margin-bottom: 20px;
        }

        .info-item {
            padding: 10px 15px;
            margin-top: 10px;
            border-left: 4px solid var(--secondary-color);
            background-color: #fffde7; /* 淺黃色 */
            border-radius: 4px;
        }
        
        .info-label {
            display: block;
            font-weight: 300;
            font-size: 0.85em;
            color: #757575;
            margin-bottom: 3px;
        }
        
        .info-value {
            font-weight: 500;
            margin: 0;
        }
        
        .info-route {
            font-size: 0.9em;
            color: #424242;
            margin: 3px 0 0 0;
        }
        
        .car-group .info-item {
            border-left-color: #ff7043; /* 橘色 for car */
            background-color: #fbe9e7;
        }
        
        /* --- Expense Tab --- */
        .expense-tab {
            padding: 20px;
            background-color: var(--text-light);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
        
        .total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #e8f5e9; /* 淺綠色 */
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            border: 1px solid #c8e6c9;
        }
        
        .total-box h3 {
            margin: 0;
            font-size: 1.2em;
        }
        
        .total-jpy-amount {
            font-size: 1.4em;
            font-weight: 700;
            color: #d84315; /* 深橘色 */
        }
        
        .add-expense-btn {
            padding: 8px 15px;
            background-color: #ff8a65; /* 橘色 */
            color: var(--text-light);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .add-expense-btn:hover {
            background-color: #ff7043;
        }

        .table-scroll-wrapper {
            overflow-x: auto;
        }

        .expense-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
            min-width: 500px;
        }

        .expense-table th, .expense-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        .expense-table th {
            background-color: var(--background-dark);
            font-weight: 700;
            color: var(--primary-color);
            position: sticky;
            top: 0;
        }
        
        .expense-table td {
            background-color: var(--text-light);
        }
        
        .expense-price {
            font-weight: 500;
            color: #d84315;
            white-space: nowrap;
        }
        
        .delete-btn-sm {
            background-color: #ef9a9a;
            color: var(--text-dark);
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.75em;
            transition: background-color 0.2s;
        }
        
        .delete-btn-sm:hover {
            background-color: #e57373;
        }

        /* --- Modal (通用) --- */
        .modal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none; /* 預設隱藏 */
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background-color: var(--text-light);
            padding: 30px;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 500px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            animation: slideIn 0.3s ease-out;
        }
        
        .modal-content h2 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover,
        .close-btn:focus {
            color: var(--primary-color);
            text-decoration: none;
        }

        /* Modal Form Styles */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9em;
            color: #455a64;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .form-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .form-actions .submit-btn {
            background-color: var(--primary-color);
            color: var(--text-light);
        }
        
        .form-actions .delete-btn {
            background-color: #ef5350;
            color: var(--text-light);
        }

        .form-actions .submit-btn:hover {
            background-color: #00796b;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>

        function updateState(newState) {

            if (newState.currentTab && newState.currentTab !== 'trip') {

            currentState.editingItem = { dayIndex, itemIndex: -1, item: { id: null, title: '', time: '', ticket: '', feature: '', location: '', travelTime: '' } };

            modalContainer.style.display = 'none';
            currentState.editingItem = null;

        function renderActivityForm(item) {
            const isEditing = !!item.id;
            const formHtml = `
                <div class="form-group">
                    <label for="title">活動標題 (必填)</label>
                    <input type="text" id="title" name="title" value="${item.title || ''}" required>

                </div>
                <div class="form-actions">
                    ${isEditing ? `<button type="button" class="delete-btn" onclick="deleteActivity(${currentState.editingItem.dayIndex}, ${currentState.editingItem.itemIndex})">刪除</button>` : '<div></div>'}
                    <button type="submit" class="submit-btn">${isEditing ? '儲存修改' : '新增行程'}</button>

            `;
            activityForm.innerHTML = formHtml;
            activityForm.onsubmit = saveActivity;
        }

        function saveActivity(e) {
            e.preventDefault();
            const { dayIndex, itemIndex, item } = currentState.editingItem;
            
            const formData = {
                title: document.getElementById('title').value,
                time: document.getElementById('time').value,
                location: document.getElementById('location').value,
                travelTime: document.getElementById('travelTime').value,
                ticket: document.getElementById('ticket').value,
                feature: document.getElementById('feature').value,
            };

            if (!formData.title) {
                alert('活動標題是必填的！');
                return;
            }

            const newTrip = [...currentState.trip];
            const newDetails = [...newTrip[dayIndex].details];

            if (itemIndex === -1) { // 新增
                const newItem = {
                    id: nextActivityId++,
                    ...formData,
                };
                newDetails.push(newItem);
                newTrip[dayIndex].details = newDetails;
            } else { // 編輯
                newDetails[itemIndex] = { ...item, ...formData };
                newTrip[dayIndex].details = newDetails;
            }

            updateState({ trip: newTrip });
            closeModal();
        }

        function deleteActivity(dayIndex, itemIndex) {
            if (!confirm('確定要刪除此行程項目嗎？')) return;

            const newTrip = [...currentState.trip];
            newTrip[dayIndex].details.splice(itemIndex, 1);
            
            updateState({ trip: newTrip });
            closeModal();
        }
        window.deleteActivity = deleteActivity;

        function moveActivity(dayIndex, itemIndex, direction) {
            const newTrip = [...currentState.trip];
            const newDetails = [...newTrip[dayIndex].details];

            const itemToMove = newDetails.splice(itemIndex, 1)[0];
            newDetails.splice(itemIndex + direction, 0, itemToMove);

            newTrip[dayIndex].details = newDetails;
            updateState({ trip: newTrip });
        }
        window.moveActivity = moveActivity;


        // --- 花費記錄邏輯 (Modal) ---
        
        function openExpenseModal() {
            renderExpenseForm();
            expenseModalContainer.style.display = 'flex';
        }
        window.openExpenseModal = openExpenseModal;
        
        function closeExpenseModal() {
            expenseModalContainer.style.display = 'none';
        }
        window.closeExpenseModal = closeExpenseModal;
        
        function renderExpenseForm() {
            // 自動帶入當前日期 (月份/日期)
            const today = new Date();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const defaultDate = `${month}-${day}`;
            
            const expenseCategories = ['餐飲', '交通', '門票', '住宿', '購物', '雜項'];
            const categoryOptions = expenseCategories.map(c => `<option value="${c}">${c}</option>`).join('');
            
            const formHtml = `
                <div class="form-group">
                    <label for="expense-date">日期 (MM-DD)</label>
                    <input type="text" id="expense-date" name="date" value="${defaultDate}" required pattern="\\d{2}-\\d{2}" placeholder="例如: 03-06">
                </div>
                <div class="form-group">
                    <label for="expense-price">價格 (JPY)</label>
                    <input type="number" id="expense-price" name="price" required min="10">
                </div>
                <div class="form-group">
                    <label for="expense-category">分類</label>
                    <select id="expense-category" name="category" required>
                        ${categoryOptions}
                    </select>
                </div>
                <div class="form-group">
                    <label for="expense-method">支付方式</label>
                    <select id="expense-method" name="method" required>
                        <option value="現金">現金</option>
                        <option value="刷卡">刷卡</option>
                        <option value="電子支付">電子支付</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="expense-note">備註</label>
                    <input type="text" id="expense-note" name="note">
                </div>
                <div class="form-actions">
                    <div></div>
                    <button type="submit" class="submit-btn">儲存花費</button>
                </div>
            `;
            expenseForm.innerHTML = formHtml;
            expenseForm.onsubmit = saveExpense;
        }

        function saveExpense(e) {
            e.preventDefault();
            
            const formData = {
                id: nextExpenseId++,
                date: document.getElementById('expense-date').value,
                price: parseInt(document.getElementById('expense-price').value),
                currency: 'JPY',
                method: document.getElementById('expense-method').value,
                category: document.getElementById('expense-category').value,
                note: document.getElementById('expense-note').value,
            };

            if (!formData.date.match(/\d{2}-\d{2}/) || isNaN(formData.price) || formData.price <= 0) {
                alert('請檢查日期格式(MM-DD)和價格是否輸入正確！');
                return;
            }

            const newExpenses = [...currentState.expenses, formData];
            updateState({ expenses: newExpenses });
            closeExpenseModal();
        }
        
        function deleteExpense(expenseId) {
            if (!confirm('確定要刪除這筆花費記錄嗎？')) return;

            const newExpenses = currentState.expenses.filter(e => e.id !== expenseId);
            updateState({ expenses: newExpenses });
        }
        window.deleteExpense = deleteExpense;


        // --- 渲染子函式 ---

        function renderActivityDetails(item, dayIndex, itemIndex) {
            const detailKey = `${dayIndex}-${itemIndex}`;
            const isExpanded = currentState.expandedDetails[detailKey];
            
            const mapLink = getMapLink(item.location);
            
            // 如果 location 存在，將 title 渲染為可導航的連結
            const locationLink = mapLink 
                ? `<a href="${mapLink}" target="_blank" rel="noopener noreferrer" class="location-link">${item.title} 📍</a>`
                : item.title;
            
            // 篩選出有效的值
            const detailsList = [
                { label: '⏰ 時間/時段', value: item.time }, // 調整 label
                { label: '🎫 門票費用', value: item.ticket },
                { label: '🌟 特色&備註', value: item.feature },
            ].filter(d => d.value && d.value.trim() !== '' && d.value.trim() !== '無'); 

            // 將 feature 內容中的分號替換為換行符，使文字更易閱讀
            const formattedFeature = item.feature ? item.feature.replace(/：/g, ': ').replace(/。/g, '。\n').replace(/；/g, '；\n') : '';

            // 根據篩選後的列表渲染 HTML
            const detailsHtml = detailsList.length > 0 && isExpanded
                ? `<ul class="detail-list">
                    ${detailsList.map(d => {
                        // 特色/備註單獨處理，使用 <pre> 保持格式
                        if (d.label === '🌟 特色&備註') {
                            return `<li class="feature-item"><span class="detail-label">🌟 完整特色/備註</span>: <pre>${formattedFeature}</pre></li>`;
                        } else {
                            return `<li><span class="detail-label">${d.label}</span>: ${d.value}</li>`;
                        }
                    }).join('')}
                    </ul>`
                : '';
            
            const expandButton = detailsList.length > 0
                ? `<button class="expand-btn" onclick="toggleDetails('${detailKey}')">${isExpanded ? '▲ 收起細節' : '▼ 詳細資訊'}</button>`
                : '';
            
            // 行程排序與編輯按鈕
            const controls = `
                <div class="activity-controls">
                    <button class="menu-btn edit-btn" onclick="openModalForEdit(${dayIndex}, ${itemIndex})">⚙️</button>
                    ${itemIndex > 0 ? `<button class="menu-btn sort-btn" onclick="moveActivity(${dayIndex}, ${itemIndex}, -1)">⬆️</button>` : ''}
                    ${itemIndex < currentState.trip[dayIndex].details.length - 1 ? `<button class="menu-btn sort-btn" onclick="moveActivity(${dayIndex}, ${itemIndex}, 1)">⬇️</button>` : ''}
                </div>
            `;

            return `
                <li class="activity-item" data-id="${item.id}">
                    <div class="activity-content">
                        <div class="description-wrap">
                            ${locationLink}
                            ${expandButton}
                        </div>
                    </div>
                    ${controls}
                    ${detailsHtml}
                </li>
            `;
        }


        function renderDayCard(day, dayIndex) {
            let activitiesHtml = '';
            day.details.forEach((item, itemIndex) => {
                
                // 1. 渲染到達當前地點的交通時間
                if (item.travelTime && item.travelTime.trim() !== '' && item.travelTime.trim() !== '無') {
                    // 判斷是否為步行，決定使用的圖標 
                    const transportIcon = item.travelTime.includes('步行') ? '🚶' : '🚗';
                    
                    // 交通時間現在渲染在行程內容 (Activity Item) 上方
                    activitiesHtml += `<p class="travel-time travel-to-item"><span class="icon">${transportIcon}</span> ${item.travelTime}</p>`;
                }

                // 2. 渲染當前行程內容 (Activity Item)
                activitiesHtml += renderActivityDetails(item, dayIndex, itemIndex);
            });
            
            // 渲染過路費欄位
            const tollHtml = day.dailyTollEstimate 
                ? `<div class="toll-estimate">💸 預估過路費: ${day.dailyTollEstimate}</div>`
                : '';

            return `
                <div class="day-card">
                    <h2 class="card-title">${day.icon} ${day.title}</h2>
                    
                    <div class="weather-box">
                        <span class="weather-icon">${day.weather.icon}</span>
                        <div class="weather-info">
                            <p>天氣: ${day.weather.desc}</p>
                            <p>溫度: ${day.weather.temp}</p>
                        </div>
                    </div>

                    ${tollHtml}

                    <ul class="activity-list">
                        ${activitiesHtml}
                    </ul>
                    <button class="add-item-btn" onclick="openModalForNew(${dayIndex})">+ 新增行程項目</button>
                </div>
            `;
        }
        
        function renderInfoTab() {
            const flightsHtml = infoData.flights.map(f => `
                <div class="info-item flight-item">
                    <span class="info-label">航班編號</span>
                    <p class="info-value">✈️ ${f.flight} (${f.type})</p>
                    <p class="info-route">${f.route}</p>
                </div>
            `).join('');

            const hotelsHtml = infoData.hotels.map(h => {
                const mapLink = getMapLink(h.location);
                const nameHtml = mapLink 
                    ? `<a href="${mapLink}" target="_blank" rel="noopener noreferrer">${h.name}</a>`
                    : h.name;
                return `
                <div class="info-item hotel-item">
                    <span class="info-label">入住期間：${h.dates}</span>
                    <p class="info-value">🏨 ${nameHtml}</p>
                </div>
            `}).join('');
            
            // 渲染租車資訊
            const carRentalHtml = `
                <div class="info-group car-group">
                    <div class="info-item car-item">
                        <span class="info-label">租車公司：Nissan Rent a car</span>
                        <p class="info-value">🚗 取車：${infoData.carRental.pickup}</p>
                        <p class="info-value">🗝️ 還車：${infoData.carRental.dropoff}</p>
                        <p class="info-value toll-estimate">💸 預估總過路費：${infoData.carRental.totalTollEstimate}</p>
                    </div>
                </div>
            `;


            return `
                <div class="info-tab">
                    <h2>✈️ 航班資訊</h2>
                    <div class="info-group flight-group">
                        ${flightsHtml}
                    </div>
                    <h2>🏨 住宿資訊</h2>
                    <div class="info-group hotel-group">
                        ${hotelsHtml}
                    </div>
                    <h2>🔑 自駕租車資訊</h2>
                    ${carRentalHtml}
                </div>
            `;
        }
        
        function renderExpenseTab() {
            // 假設所有花費都是日圓，計算總和
            const totalJpy = currentState.expenses.reduce((sum, item) => sum + item.price, 0);
            
            // 確保 expenses 根據日期排序，最新的在前面
            const sortedExpenses = [...currentState.expenses].sort((a, b) => {
                // 為了排序，假設年份為 2024
                const dateA = new Date('2024-' + a.date);
                const dateB = new Date('2024-' + b.date);
                return dateA - dateB; // 升序排列
            }).reverse(); // 反轉為降序 (最新在最上面)

            const rowsHtml = sortedExpenses.map(e => `
                <tr>
                    <td>${e.date || 'N/A'}</td> 
                    <td class="expense-price">${e.price.toLocaleString('ja-JP')} ${e.currency}</td>
                    <td>${e.method}</td>
                    <td>${e.category}</td>
                    <td>${e.note}</td>
                    <td><button onclick="deleteExpense(${e.id})" class="delete-btn-sm">× 刪除</button></td>
                </tr>
            `).join('');

            return `
                <div class="expense-tab">
                    <div class="total-box">
                        <h3>總記錄花費： <span class="total-jpy-amount">${totalJpy.toLocaleString('ja-JP')} JPY</span></h3>
                        <button class="add-expense-btn" onclick="openExpenseModal()">+ 新增花費</button>
                    </div>
                    
                    <div class="table-scroll-wrapper">
                        <table class="expense-table">
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>價格</th>
                                    <th>支付</th>
                                    <th>分類</th>
                                    <th>備註</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHtml}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // 核心渲染函式
        function renderApp() {
            const state = currentState;
            
            let mainContent = '';
            
            // 頂部導航欄 (Tab Navigator)
            const tabNavHtml = `
                <nav class="main-tab-nav">
                    <button class="main-tab-btn ${state.currentTab === 'trip' ? 'active' : ''}" onclick="updateState({ currentTab: 'trip', currentDay: 0 })">🗺️ 行程</button>
                    <button class="main-tab-btn ${state.currentTab === 'info' ? 'active' : ''}" onclick="updateState({ currentTab: 'info' })">ℹ️ 資訊</button>
                    <button class="main-tab-btn ${state.currentTab === 'expense' ? 'active' : ''}" onclick="updateState({ currentTab: 'expense' })">💰 花費</button>
                </nav>
            `;

            if (state.currentTab === 'info') {
                mainContent = renderInfoTab();
            } else if (state.currentTab === 'expense') {
                mainContent = renderExpenseTab();
            } else {
                // Trip Tab
                const currentDayData = state.trip[state.currentDay];
                
                // 日期選擇導航
                const dayNavButtonsHtml = state.trip.map((day, index) => {
                    const isActive = state.currentDay === index ? 'active' : '';
                    const dayString = day.day; 
                    const dateString = day.date.split('/')[1]; 
                    
                    return `<button class="nav-button ${isActive}" onclick="updateState({ currentDay: ${index} })">
                                <span class="nav-day">${dayString}</span>
                                <span class="nav-date">${dateString}</span>
                            </button>`;
                }).join('');
                
                const dayDetailHtml = renderDayCard(currentDayData, state.currentDay);

                mainContent = `
                    <div class="day-nav">
                        ${dayNavButtonsHtml}
                    </div>
                    ${dayDetailHtml}
                `;
            }
            
            // 結合 Tab Nav 和 Main Content
            appContainer.innerHTML = tabNavHtml + mainContent;
        }

        // 初始化應用程式
        renderApp();
    </script>
</body>
</html>
